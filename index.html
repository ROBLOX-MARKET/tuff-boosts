<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Buzzer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: single-column mobile app — add-alert card, live alert list, big arm bar pinned bottom.
   Committed dark "trading terminal" palette. */
:root{
  --bg:#0a0e13; --surface:#121922; --surface2:#0e151d; --line:#1f2b38;
  --fg:#e9f0f7; --muted:#8498a9; --accent:#19e0ff; --accent2:#3ba9ff;
  --good:#37d98a; --bad:#ff5d7a; --warn:#ffce4d;
  color-scheme:dark;
  --f-head:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100%}
html,body{height:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
h1{font-family:var(--f-head);font-weight:700;font-size:1.6rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.statepill{font-family:var(--f-head);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.statepill.on{color:#04222b;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.lab{font-family:var(--f-head);font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
select,input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);color:var(--fg);
  font-family:var(--f-body);font-size:1rem;padding:12px;border-radius:11px;appearance:none}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.f-coin{flex:2 1 150px}.f-dir{flex:1 1 90px}.f-amt{flex:1 1 110px}
.addbtn{margin-top:12px;width:100%;font-family:var(--f-head);font-weight:600;font-size:1rem;color:#04222b;
  background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;border-radius:12px;padding:14px;cursor:pointer}
.addbtn:active{transform:scale(.99)}

.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  display:flex;align-items:center;gap:12px}
.alert.ring{border-color:var(--bad);animation:pulse 1s ease-in-out infinite}
.alert.done{opacity:.6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,122,.0)}50%{box-shadow:0 0 0 4px rgba(255,93,122,.25)}}
@media (prefers-reduced-motion:reduce){.alert.ring{animation:none}}
.sym{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-head);font-weight:700;font-size:.8rem;background:var(--surface2);border:1px solid var(--line)}
.ainfo{flex:1;min-width:0}
.aname{font-weight:600}
.acond{font-size:.82rem;color:var(--muted)}
.acond b{color:var(--fg);font-variant-numeric:tabular-nums}
.aright{text-align:right;flex:0 0 auto}
.aprice{font-variant-numeric:tabular-nums;font-weight:600}
.astat{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.astat.good{color:var(--good)}.astat.bad{color:var(--bad)}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:0 4px;line-height:1}
.mini{background:var(--surface2);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  font-size:.74rem;padding:5px 9px;cursor:pointer;font-family:var(--f-head);font-weight:600}

.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:.9rem}
.note{color:var(--muted);font-size:.78rem;line-height:1.5;margin-top:18px}
.note b{color:var(--fg)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface2);
  border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.barin{max-width:560px;margin:0 auto;display:flex;gap:10px}
.arm{flex:2;font-family:var(--f-head);font-weight:700;font-size:1.05rem;border:0;border-radius:13px;padding:15px;cursor:pointer;
  color:#04222b;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.arm.off{color:var(--fg);background:var(--surface);border:1px solid var(--line)}
.test{flex:1;font-family:var(--f-head);font-weight:600;font-size:.95rem;border:1px solid var(--line);border-radius:13px;
  background:var(--surface);color:var(--fg);cursor:pointer}
.updated{text-align:center;font-size:.72rem;color:var(--muted);margin-top:8px}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.92);display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.overlay.show{display:flex}
.siren{font-size:3rem;animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.siren{animation:none}}
.otitle{font-family:var(--f-head);font-weight:700;font-size:1.5rem;margin:10px 0 4px}
.olist{color:var(--warn);font-size:1.05rem;margin-bottom:26px;font-variant-numeric:tabular-nums}
.stop{font-family:var(--f-head);font-weight:700;font-size:1.2rem;color:#fff;background:var(--bad);
  border:0;border-radius:14px;padding:18px 40px;cursor:pointer}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div>
      <h1>Coin Buzzer</h1>
      <p class="sub">Buzzes &amp; beeps when a coin hits your price.</p>
    </div>
    <span class="statepill" id="statepill">Off</span>
  </div>

  <div class="card">
    <div class="lab">New alert</div>
    <div class="row">
      <select class="f-coin" id="coin" aria-label="Coin"></select>
      <select class="f-dir" id="dir" aria-label="Direction">
        <option value="above">rises to ≥</option>
        <option value="below">drops to ≤</option>
      </select>
      <input class="f-amt" id="target" inputmode="decimal" placeholder="$ price" aria-label="Target price">
    </div>
    <button class="addbtn" id="add">+ Add alert</button>
  </div>

  <div class="list" id="list"></div>

  <p class="note" id="note"></p>
</div>

<div class="bar">
  <div class="barin">
    <button class="arm off" id="arm">Arm alerts</button>
    <button class="test" id="test">Test buzz</button>
  </div>
  <div class="updated" id="updated"></div>
</div>

<div class="overlay" id="overlay">
  <div class="siren">🚨</div>
  <div class="otitle">Price hit!</div>
  <div class="olist" id="olist"></div>
  <button class="stop" id="stop">Stop</button>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<script>
var COINS=[
 {id:'bitcoin',sym:'BTC',name:'Bitcoin'},{id:'ethereum',sym:'ETH',name:'Ethereum'},
 {id:'solana',sym:'SOL',name:'Solana'},{id:'litecoin',sym:'LTC',name:'Litecoin'},
 {id:'tether',sym:'USDT',name:'Tether'},{id:'binancecoin',sym:'BNB',name:'BNB'},
 {id:'ripple',sym:'XRP',name:'XRP'},{id:'cardano',sym:'ADA',name:'Cardano'},
 {id:'dogecoin',sym:'DOGE',name:'Dogecoin'},{id:'tron',sym:'TRX',name:'TRON'},
 {id:'chainlink',sym:'LINK',name:'Chainlink'},{id:'polkadot',sym:'DOT',name:'Polkadot'},
 {id:'avalanche-2',sym:'AVAX',name:'Avalanche'},{id:'shiba-inu',sym:'SHIB',name:'Shiba Inu'},
 {id:'pepe',sym:'PEPE',name:'Pepe'},{id:'dogwifcoin',sym:'WIF',name:'dogwifhat'}
];
var byId={};COINS.forEach(function(c){byId[c.id]=c;});
var coinSel=document.getElementById('coin');
COINS.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.sym+' · '+c.name;coinSel.appendChild(o);});

var LS='coinbuzzer.alerts.v1';
function load(){try{var r=localStorage.getItem(LS);if(r)return JSON.parse(r);}catch(e){}
  return [{id:'ex',coin:'bitcoin',dir:'above',target:100000,status:'armed',example:true}];}
function save(){try{localStorage.setItem(LS,JSON.stringify(alerts));}catch(e){}}
var alerts=load();

var prices={}, armed=false, pollTimer=null, ringTimer=null, wakeLock=null, audioCtx=null;

function fmt(n){if(n==null)return '—';n=Number(n);
  if(n>=1000)return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});
  if(n>=1)return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2});
  if(n>=0.01)return '$'+n.toFixed(4);
  return '$'+n.toPrecision(3);}

function render(){
  var list=document.getElementById('list');list.innerHTML='';
  if(!alerts.length){list.innerHTML='<div class="empty">No alerts yet. Add one above ☝️</div>';}
  alerts.forEach(function(a){
    var c=byId[a.coin]||{sym:'?',name:a.coin};var p=prices[a.coin];
    var el=document.createElement('div');el.className='alert'+(a.status==='ring'?' ring':'')+(a.status==='done'?' done':'');
    var stat=a.status==='ring'?'<span class="astat bad">● RINGING</span>'
      :a.status==='done'?'<span class="astat">✓ fired</span>'
      :armed?'<span class="astat good">● watching</span>':'<span class="astat">off</span>';
    el.innerHTML=
      '<div class="sym">'+c.sym+'</div>'+
      '<div class="ainfo"><div class="aname">'+c.name+(a.example?' <span style="color:var(--muted);font-weight:400;font-size:.75rem">(example)</span>':'')+'</div>'+
        '<div class="acond">'+(a.dir==='above'?'≥':'≤')+' <b>'+fmt(a.target)+'</b></div></div>'+
      '<div class="aright"><div class="aprice">'+fmt(p)+'</div>'+stat+
        (a.status==='done'?' <button class="mini" data-rearm="'+a.id+'">Re-arm</button>':'')+'</div>'+
      '<button class="x" data-del="'+a.id+'" aria-label="Delete">×</button>';
    list.appendChild(el);
  });
  document.getElementById('statepill').className='statepill'+(armed?' on':'');
  document.getElementById('statepill').textContent=armed?'Watching':'Off';
  var arm=document.getElementById('arm');arm.textContent=armed?'Disarm':'Arm alerts';arm.className='arm'+(armed?'':' off');
}

document.getElementById('list').addEventListener('click',function(e){
  var d=e.target.getAttribute('data-del');var r=e.target.getAttribute('data-rearm');
  if(d){alerts=alerts.filter(function(a){return a.id!==d;});save();checkRing();render();}
  if(r){var a=alerts.find(function(x){return x.id===r;});if(a){a.status='armed';a.example=false;save();render();}}
});

document.getElementById('add').addEventListener('click',function(){
  var coin=coinSel.value, dir=document.getElementById('dir').value;
  var t=parseFloat(String(document.getElementById('target').value).replace(/[, $]/g,''));
  if(!(t>0)){document.getElementById('target').focus();return;}
  // drop the seeded example once the user adds a real one
  alerts=alerts.filter(function(a){return !a.example;});
  alerts.push({id:'a'+Date.now(),coin:coin,dir:dir,target:t,status:'armed'});
  document.getElementById('target').value='';save();render();if(armed)poll();
});

/* ---- audio + buzz ---- */
/* loud back-to-back siren sweeps (~1.3s of continuous noise) */
function siren(){try{if(!audioCtx)return;var t=audioCtx.currentTime;
  for(var k=0;k<4;k++){var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.connect(g);g.connect(audioCtx.destination);var s=t+k*0.33;
    o.frequency.setValueAtTime(1000,s);o.frequency.linearRampToValueAtTime(600,s+0.16);o.frequency.linearRampToValueAtTime(1000,s+0.31);
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.5,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.32);
    o.start(s);o.stop(s+0.33);}}catch(e){}}
/* long, relentless vibration */
function buzz(){if(navigator.vibrate)try{navigator.vibrate([700,150,700,150,700,150,900,150,700]);}catch(e){}siren();}
function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}

/* ---- ring loop ---- */
function checkRing(){
  var ringing=alerts.some(function(a){return a.status==='ring';});
  var ov=document.getElementById('overlay');
  if(ringing){
    var names=alerts.filter(function(a){return a.status==='ring';}).map(function(a){
      var c=byId[a.coin]||{sym:a.coin};return c.sym+' '+(a.dir==='above'?'≥':'≤')+' '+fmt(a.target);});
    document.getElementById('olist').innerHTML=names.join('<br>');
    ov.classList.add('show');
    if(!ringTimer){buzz();ringTimer=setInterval(buzz,1300);}
  }else{
    ov.classList.remove('show');
    if(ringTimer){clearInterval(ringTimer);ringTimer=null;}
    if(navigator.vibrate)try{navigator.vibrate(0);}catch(e){}
  }
}
document.getElementById('stop').addEventListener('click',function(){
  alerts.forEach(function(a){if(a.status==='ring')a.status='done';});save();checkRing();render();});

/* ---- polling ---- */
function evaluate(){
  alerts.forEach(function(a){
    if(a.status!=='armed')return;var p=prices[a.coin];if(p==null)return;
    if((a.dir==='above'&&p>=a.target)||(a.dir==='below'&&p<=a.target))a.status='ring';
  });save();checkRing();render();
}
function poll(){
  var ids=alerts.filter(function(a){return a.status!=='done';}).map(function(a){return a.coin;});
  ids=ids.filter(function(v,i,s){return s.indexOf(v)===i;});
  if(!ids.length){render();return;}
  fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids.join(',')+'&vs_currencies=usd')
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(d){Object.keys(d).forEach(function(k){if(d[k]&&d[k].usd!=null)prices[k]=d[k].usd;});
      document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString();
      evaluate();})
    .catch(function(){document.getElementById('updated').textContent='Couldn’t reach price feed — retrying…';});
}
async function reqWake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',function(){if(armed&&document.visibilityState==='visible'){reqWake();poll();}});

function setArmed(on){
  armed=on;
  if(on){unlockAudio();reqWake();poll();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(poll,30000);}
  else{if(pollTimer){clearInterval(pollTimer);pollTimer=null;}if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}}
  render();
}
document.getElementById('arm').addEventListener('click',function(){setArmed(!armed);});
document.getElementById('test').addEventListener('click',function(){unlockAudio();buzz();});

document.getElementById('note').innerHTML=
  'When it fires it’s a <b>loud siren + nonstop vibration</b> until you tap Stop. For it to reach you: '+
  '<b>keep this tab open and the screen on</b> (the app holds the screen awake while armed), <b>turn your volume up</b>, and turn <b>off silent mode</b> — a web page can’t override silent or ring through a locked/asleep phone, only a native app can. '+
  'If you lock the phone or switch apps, alerts pause until you’re back on this screen. '+
  'Prices are live market prices (CoinGecko), the same ones Exodus shows. On <b>iPhone</b> the screen won’t vibrate (Apple blocks it in browsers) — you’ll still get the siren.';

render();
</script>

</body>
</html>
